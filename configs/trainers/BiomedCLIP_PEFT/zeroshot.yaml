# BIOMEDCLIP_ZeroShot configuration

DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 32
  TEST:
    BATCH_SIZE: 32
  NUM_WORKERS: 8

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "normalize"]

TRAIN:
  PRINT_FREQ: 20

TEST:
  SPLIT: "test"

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BIOMEDCLIP_ZEROSHOT:
    PREC: "amp"
    PROMPT_MODE: "custom"
    CUSTOM_TEMPLATE: "a photo of a {}."
